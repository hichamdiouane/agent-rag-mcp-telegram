spring.application.name=rag_mcp_telegram
server.port=8087

# Groq for Chat (OpenAI-compatible API)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=${GROQ_BASE_URL}
spring.ai.openai.chat.base-url=${GROQ_BASE_URL}
spring.ai.openai.chat.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=${GROQ_MODEL}

# Ollama for Embeddings
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL}

# MCP Client
spring.ai.mcp.client.streamable-http.connections.mcptest.url=${MCP_CLIENT_BASE_URL}

# Telegram Bot API Key
telegram.api.key=${TELEGRAM_API_KEY}